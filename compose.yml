services:

  db:
    image: postgres:18
    container_name: sut-postgres

    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}

    ports:
      - "5433:5432"

    volumes:
      - sut_pgdata:/var/lib/postgresql

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10


  web:
    build:
      context: .

    container_name: sut-web

    volumes:
      - .:/app

    env_file:
      - .env

    environment:
      DB_HOST: db
      DB_PORT: "5432"
      PSYCOPG_IMPL: binary

    ports:
      - "8000:8000"

    depends_on:
      db:
        condition: service_healthy

    command:
      - sh
      - -c
      - |
        python manage.py migrate --noinput &&
        python manage.py runserver 0.0.0.0:8000

    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/', timeout=2)"
        ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s


volumes:
  sut_pgdata:
