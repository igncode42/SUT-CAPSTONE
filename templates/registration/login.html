{% extends "base.html" %}

{% block title %}Iniciar sesión | SUT{% endblock %}

{% block content %}

<div class="row justify-content-center">
    <div class="col-md-6 col-lg-4">

        <div class="card shadow-sm">
            <div class="card-body p-4">

                <h1 class="h4 mb-4">
                    Iniciar sesión
                </h1>

                {% if form.errors %}
                    <div class="alert alert-danger">
                        Usuario o contraseña incorrectos.
                    </div>
                {% endif %}

                <form method="post">
                    {% csrf_token %}

                    {{ form.as_p }}

                    <button
                        type="submit"
                        class="btn btn-primary w-100"
                    >
                        Ingresar
                    </button>
                </form>

            </div>
        </div>

    </div>
</div>

{% endblock %}
