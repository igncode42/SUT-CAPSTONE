{% extends "base.html" %}

{% block title %}Registro de vecino | SUT{% endblock %}

{% block content %}

<div class="mb-4">
    <h1 class="fw-bold">Registro de vecino</h1>

    <p class="text-secondary">
        Crea una cuenta para registrarte como vecino de la unidad territorial.
    </p>
</div>

<div class="card shadow-sm">
    <div class="card-body">

        <form method="post">
            {% csrf_token %}

            {{ form.as_p }}

            <button type="submit" class="btn btn-primary">
                Registrarme
            </button>
        </form>

    </div>
</div>

{% endblock %}
