<!doctype html>
<html lang="es">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>{% block title %}Sistema Unidad Territorial{% endblock %}</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >
</head>

<body class="bg-light">

<nav class="navbar navbar-dark bg-dark">
    <div class="container">

        <a
            class="navbar-brand fw-bold"
            href="{% url 'home' %}"
        >
            Sistema Unidad Territorial
        </a>

        <div class="d-flex gap-2 align-items-center">

            {% if user.is_authenticated %}

                <a
                    class="btn btn-outline-light btn-sm"
                    href="{% url 'panel' %}"
                >
                    Panel
                </a>

                <span class="text-light small">
                    {{ user.username }}
                </span>

                <form
                    method="post"
                    action="{% url 'logout' %}"
                    class="m-0"
                >
                    {% csrf_token %}

                    <button
                        type="submit"
                        class="btn btn-outline-light btn-sm"
                    >
                        Cerrar sesión
                    </button>
                </form>

            {% else %}

                <a
                    class="btn btn-outline-light btn-sm"
                    href="{% url 'login' %}"
                >
                    Iniciar sesión
                </a>

            {% endif %}

            <a
                class="btn btn-outline-light btn-sm"
                href="/admin/"
            >
                Administración
            </a>

        </div>

    </div>
</nav>

<main class="container py-5">
    {% block content %}
    {% endblock %}
</main>

</body>
</html>
